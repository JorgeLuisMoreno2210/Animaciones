<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon/conejo.png">
  <title>Bunny Rush - Enhanced</title>
</head>
<body>
  <div class="game-container">
    <div class="score-board">
      <div class="score-label">🏆 Score:</div>
      <div class="score-display"></div>
    </div>
    
    <div class="phone">
      <h1 class="tittle">Bunny Rush 🐰</h1>
      
      <!-- Capa 1 - Conejo Blanco Móvil -->
      <div class="layer-1">
        <input type="checkbox" />
        <div class="left-ear-outer"></div>
        <div class="left-ear-inner"></div>
        <div class="right-ear-outer"></div>
        <div class="right-ear-inner"></div>
        <div class="head">
          <div class="head-eye">
            <div class="head-eye-left"></div>
            <div class="head-eye-right"></div>
          </div>
        </div>
      </div>

      <!-- Capa 2 - Conejo Gris Móvil -->
      <div class="layer-2">
        <input type="checkbox" />
        <div class="left-ear-outer2"></div>
        <div class="left-ear-inner2"></div>
        <div class="right-ear-outer2"></div>
        <div class="right-ear-inner2"></div>
        <div class="head2">
          <div class="head-eye2">
            <div class="head-eye-left2"></div>
            <div class="head-eye-right2"></div>
          </div>
        </div>
      </div>

      <!-- Capa 3 - Fondo -->
      <div class="layer-3">
        <div class="lawn"></div>
        <div class="land"></div>
      </div>

      <!-- Capa 4 - Conejo Marrón Móvil -->
      <div class="layer-4">
        <input type="checkbox" />
        <div class="left-ear-outer4"></div>
        <div class="left-ear-inner4"></div>
        <div class="right-ear-outer4"></div>
        <div class="right-ear-inner4"></div>
        <div class="head4">
          <div class="head-eye4">
            <div class="head-eye-left4"></div>
            <div class="head-eye-right4"></div>
          </div>
        </div>
      </div>

      <!-- Capa 5 - Fondo -->
      <div class="layer-5">
        <div class="lawn"></div>
        <div class="land"></div>
      </div>

      <!-- Capa 6 - Conejo Blanco Semi-móvil -->
      <div class="layer-6">
        <input type="checkbox" />
        <div class="left-ear-outer6"></div>
        <div class="left-ear-inner6"></div>
        <div class="right-ear-outer6"></div>
        <div class="right-ear-inner6"></div>
        <div class="head6">
          <div class="head-eye6">
            <div class="head-eye-left6"></div>
            <div class="head-eye-right6"></div>
          </div>
        </div>
      </div>

      <!-- Capa 7 - Fondo -->
      <div class="layer-7">
        <div class="lawn"></div>
        <div class="land"></div>
      </div>

      <!-- Capas de arbustos -->
      <div class="layer-8">
        <div class="bush1"></div>
        <div class="bush2"></div>
      </div>
      
      <div class="layer-9">
        <div class="white-bush1"></div>
        <div class="white-bush2"></div>
        <div class="white-bush3"></div>
      </div>
      
      <div class="layer-10">
        <div class="white-bush4"></div>
        <div class="white-bush5"></div>
        <div class="white-bush6"></div>
      </div>
    </div>
  </div>
</body>
</html>
